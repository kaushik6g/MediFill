<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="900" viewBox="0 0 2600 900" role="img" aria-labelledby="title desc">
  <title id="title">MediFill Workflow Horizontal Diagram</title>
  <desc id="desc">User Login to Pharmacy Assistance horizontal process flow</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1f6feb" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6feb"/>
    </marker>
    <style>
      .title { font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 56px; font-weight: 700; fill: #0b1f3a; }
      .subtitle { font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 24px; fill: #335b8e; }
      .box { fill: #e8f3ff; stroke: #1f6feb; stroke-width: 3; rx: 18; ry: 18; filter: url(#shadow); }
      .text { font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 24px; font-weight: 600; fill: #0b1f3a; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #1f6feb; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .stepNo { font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 18px; font-weight: 700; fill: #1f6feb; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="2600" height="900" fill="url(#bg)"/>

  <text x="1300" y="90" class="title">MediFill Workflow</text>
  <text x="1300" y="132" class="subtitle">Cloud Product and Platform Engineering Process Flow (Horizontal)</text>

  <g transform="translate(70, 280)">
    <rect class="box" x="0" y="90" width="240" height="120"/>
    <text class="stepNo" x="120" y="78">Step 1</text>
    <text class="text" x="120" y="150">User Login</text>

    <line class="arrow" x1="250" y1="150" x2="295" y2="150"/>

    <rect class="box" x="305" y="90" width="250" height="120"/>
    <text class="stepNo" x="430" y="78">Step 2</text>
    <text class="text" x="430" y="150">Auth Validation</text>

    <line class="arrow" x1="565" y1="150" x2="610" y2="150"/>

    <rect class="box" x="620" y="90" width="250" height="120"/>
    <text class="stepNo" x="745" y="78">Step 3</text>
    <text class="text" x="745" y="150">Home Dashboard</text>

    <line class="arrow" x1="880" y1="150" x2="925" y2="150"/>

    <rect class="box" x="935" y="60" width="290" height="180"/>
    <text class="stepNo" x="1080" y="48">Step 4</text>
    <text class="text" x="1080" y="130">Add Medicine</text>
    <text class="text" x="1080" y="170">(Manual/OCR)</text>

    <line class="arrow" x1="1235" y1="150" x2="1280" y2="150"/>

    <rect class="box" x="1290" y="60" width="340" height="180"/>
    <text class="stepNo" x="1460" y="48">Step 5</text>
    <text class="text" x="1460" y="130">Store Locally +</text>
    <text class="text" x="1460" y="170">Sync to Cloud</text>

    <line class="arrow" x1="1640" y1="150" x2="1685" y2="150"/>

    <rect class="box" x="1695" y="90" width="300" height="120"/>
    <text class="stepNo" x="1845" y="78">Step 6</text>
    <text class="text" x="1845" y="150">Schedule Notifications</text>

    <line class="arrow" x1="2005" y1="150" x2="2050" y2="150"/>

    <rect class="box" x="2060" y="90" width="250" height="120"/>
    <text class="stepNo" x="2185" y="78">Step 7</text>
    <text class="text" x="2185" y="150">Generate Alerts</text>
  </g>

  <g transform="translate(570, 560)">
    <rect class="box" x="0" y="0" width="300" height="120"/>
    <text class="stepNo" x="150" y="-12">Step 8</text>
    <text class="text" x="150" y="60">Track Adherence</text>

    <line class="arrow" x1="310" y1="60" x2="355" y2="60"/>

    <rect class="box" x="365" y="0" width="330" height="120"/>
    <text class="stepNo" x="530" y="-12">Step 9</text>
    <text class="text" x="530" y="60">Pharmacy Assistance</text>
  </g>

  <path class="arrow" d="M 2380 430 C 2450 430, 2490 500, 2490 560 C 2490 655, 2400 700, 2100 700 L 1275 700"/>
</svg>
